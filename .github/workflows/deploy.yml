name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "440173072518"

  ECR_BACKEND: my-terra-proj-backend
  ECR_FRONTEND: my-terra-proj-frontend

  ECS_CLUSTER: my-terra-proj-cluster
  ECS_BACKEND_SERVICE: my-terra-proj-backend-service
  ECS_FRONTEND_SERVICE: my-terra-proj-frontend-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::440173072518:role/GitHubActions-my-terra-proj
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: echo "REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Build and push backend
        run: |
          docker build \
            -t "$REGISTRY/$ECR_BACKEND:${GITHUB_SHA}" \
            ./backend

          docker push \
            "$REGISTRY/$ECR_BACKEND:${GITHUB_SHA}"

      - name: Build and push frontend
        run: |
          docker build \
            -t "$REGISTRY/$ECR_FRONTEND:${GITHUB_SHA}" \
            ./frontend

          docker push \
            "$REGISTRY/$ECR_FRONTEND:${GITHUB_SHA}"

      - name: Download current backend task definition
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF" \
            --query taskDefinition \
            --output json > backend-task-definition.json

      - name: Update backend task definition image
        run: |
          jq --arg IMAGE "$REGISTRY/$ECR_BACKEND:${GITHUB_SHA}" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            backend-task-definition.json > backend-task-definition-new.json

      - name: Register backend task definition
        id: backend-task
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://backend-task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEFINITION=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy backend
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "${{ steps.backend-task.outputs.TASK_DEFINITION }}"

      - name: Download current frontend task definition
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_FRONTEND_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF" \
            --query taskDefinition \
            --output json > frontend-task-definition.json

      - name: Update frontend task definition image
        run: |
          jq --arg IMAGE "$REGISTRY/$ECR_FRONTEND:${GITHUB_SHA}" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            frontend-task-definition.json > frontend-task-definition-new.json

      - name: Register frontend task definition
        id: frontend-task
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://frontend-task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEFINITION=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_FRONTEND_SERVICE" \
            --task-definition "${{ steps.frontend-task.outputs.TASK_DEFINITION }}"