<!DOCTYPE html>
<html>
<head>
  <title>My-terra-proj Burgers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Order a Burger</h1>

    <div class="menu-section">
      <h2>Choose your burger</h2>
      <div id="burgerOptions" class="options"></div>

      <h2>Choose your drink</h2>
      <div id="drinkOptions" class="options"></div>

      <button id="placeOrder" disabled>Place Order</button>
      <p id="orderStatus"></p>
    </div>

    <div class="orders-section">
      <h2>Recent Orders</h2>
      <div id="ordersList"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
